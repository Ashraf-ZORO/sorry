<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>For Alaa ❤️</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h1>For My Little Lady ❤️</h1>
</div>

<!-- HEARTS -->
<div class="hearts"></div>

<!-- PASSWORD PAGE -->
<section id="passwordPage" class="page active">

  <div class="password-box">
    <h1>Enter The Password ❤️</h1>

    <input type="password" id="passwordInput" placeholder="Password">

    <button onclick="checkPassword()">Open</button>

    <p id="error"></p>
  </div>

</section>

<!-- LETTER PAGE -->
<section id="letterPage" class="page">

  <div class="letter-wrapper">

    <img src="photo.jpg" class="love-image" />

    <div class="letter">

      <h1>My Love Letter ❤️</h1>

      <p>
        حط رسالتك هنا ❤️<br><br>
        اكتب أي كلام رومانسي تحبه وهيظهر كأنه رسالة قديمة متقفولة واتفتحت ❤️
      </p>

    </div>

    <div class="scroll-down">↓</div>

    <div class="button-area">
      <button onclick="showVideoPage()">دوس علي ❤️</button>
    </div>

  </div>

</section>

<!-- VIDEO PAGE -->
<section id="videoPage" class="page">

  <div class="floating-text top-right">Love u ❤️</div>

  <div class="video-box">
    <video controls autoplay>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <div class="floating-text bottom-left">Forever ❤️</div>

</section>

<script src="script.js"></script>
</body>

</html>
